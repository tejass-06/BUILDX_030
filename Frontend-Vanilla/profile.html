<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile • NagarSaathi AI</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div id="toast-container" class="toast-container"></div>

  <main class="container" style="padding-top: 32px; padding-bottom: 60px;">
    <!-- Profile Container (Populated dynamically) -->
    <div id="profile-container">
      <div class="loading-state" style="padding: 60px 0; text-align: center;">
        <div class="spinner"></div>
        <p style="margin-top: 16px; color: var(--text-muted); font-size: 0.95rem;">Authenticating and fetching profile from NMC Server...</p>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <h3 style="font-size: 1.15rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 8px;">
            <i data-lucide="edit-3" style="width: 18px; height: 18px; color: var(--primary-color);"></i>
            Edit Profile Details
          </h3>
          <button type="button" class="btn-icon" id="close-modal-btn" aria-label="Close modal">
            <i data-lucide="x" style="width: 20px; height: 20px;"></i>
          </button>
        </div>

        <form id="edit-profile-form" style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px;">
          <!-- Profile Photo Upload -->
          <div class="form-group">
            <label class="form-label" style="font-weight: 600;">Profile Photo</label>
            <div style="display: flex; align-items: center; gap: 16px; margin-top: 6px;">
              <div id="modal-avatar-preview" style="width: 64px; height: 64px; border-radius: 50%; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #475569; overflow: hidden; border: 2px solid var(--border-color); flex-shrink: 0;">
                <span id="modal-avatar-initials">U</span>
              </div>
              <div style="flex: 1;">
                <input type="file" id="profile-photo-input" accept="image/png, image/jpeg, image/webp" style="font-size: 0.85rem; width: 100%;">
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">PNG, JPG, or WEBP up to 5MB</div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-full-name">Full Name *</label>
            <input type="text" id="edit-full-name" class="form-control" required placeholder="Your full name">
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-phone">Phone Number</label>
            <input type="tel" id="edit-phone" class="form-control" placeholder="+91 9876543210">
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-language">Preferred Language</label>
            <select id="edit-language" class="form-control">
              <option value="en">English</option>
              <option value="mr">मराठी (Marathi)</option>
              <option value="hi">हिंदी (Hindi)</option>
            </select>
          </div>

          <!-- Read-only Security Notice -->
          <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; font-size: 0.78rem; color: var(--text-muted);">
            <i data-lucide="shield" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px; color: var(--primary-color);"></i>
            Role, Department, and Admin privileges are strictly locked and managed by the NMC Governance Directory.
          </div>

          <div id="modal-status-msg" style="font-size: 0.85rem; display: none; padding: 8px 12px; border-radius: 6px;"></div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
            <button type="button" class="btn btn-secondary" id="cancel-edit-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-profile-btn" style="min-width: 120px; justify-content: center;">
              <span id="save-btn-text">Save Changes</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
