<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Grievance Workspace • NagarSaathi AI</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div id="toast-container" class="toast-container"></div>

  <main class="container" style="max-width: 960px; padding-top: 32px; padding-bottom: 60px;">
    <!-- Breadcrumb & Back -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <a href="officer.html" class="btn btn-sm btn-secondary">
        <i data-lucide="arrow-left"></i> Back to Officer Queue
      </a>
      <div id="oc-sla-badge"></div>
    </div>

    <div id="oc-loading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading grievance workspace...</p>
    </div>

    <div id="oc-content" style="display: none;">
      <!-- Top Overview Card -->
      <div class="card" style="margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;">
          <div>
            <div style="font-family: monospace; font-size: 0.85rem; font-weight: 700; color: var(--primary-color);">
              TICKET <span id="oc-id">#...</span>
            </div>
            <h2 id="oc-title" style="font-size: 1.4rem; font-weight: 800; color: #1e293b; margin: 4px 0;">
              ...
            </h2>
            <div style="font-size: 0.85rem; color: var(--text-muted);">
              Reported on <span id="oc-date">-</span> by <span id="oc-citizen-name">Citizen</span> (<span id="oc-citizen-phone">-</span>)
            </div>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;" id="oc-status-badges">
            <!-- Badges -->
          </div>
        </div>

        <!-- Description Box -->
        <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: var(--border-radius-sm); margin-bottom: 20px;">
          <h4 style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">
            Citizen Grievance Description
          </h4>
          <p id="oc-description" style="font-size: 0.95rem; color: #1e293b; line-height: 1.6; margin: 0;">
            -
          </p>
        </div>

        <!-- Grid: Location Map & Photos -->
        <div class="grid grid-2" style="margin-bottom: 24px;">
          <!-- Location Map -->
          <div>
            <h4 style="font-size: 0.9rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; gap: 4px;">
              <i data-lucide="map-pin" style="width: 16px; height: 16px; color: var(--primary-color);"></i>
              <span id="oc-location-text">Nagpur</span>
            </h4>
            <div id="oc-map" class="map-container" style="height: 220px;"></div>
          </div>

          <!-- Before Photo -->
          <div>
            <h4 style="font-size: 0.9rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; display: flex; align-items: center; gap: 4px;">
              <i data-lucide="camera" style="width: 16px; height: 16px; color: var(--primary-color);"></i> Citizen Attached Photo
            </h4>
            <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--border-radius-sm); height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
              <img id="oc-photo" src="" alt="Citizen Photo" style="width: 100%; height: 100%; object-fit: cover; display: none;">
              <div id="oc-no-photo" style="color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px;">
                <i data-lucide="image-off" style="margin-bottom: 4px;"></i>
                <div>No photo attached by citizen</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Workspace Bar -->
        <div style="border-top: 1px solid #e2e8f0; padding-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
          <div style="font-size: 0.85rem; color: var(--text-muted);">
            Current Status: <b id="oc-current-status-text" style="color: #1e293b;">-</b>
          </div>
          <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <button type="button" class="btn btn-secondary" id="btn-oc-start-work">
              <i data-lucide="play"></i> Mark In Progress
            </button>
            <a href="#" id="btn-oc-resolve-link" class="btn btn-success">
              <i data-lucide="check-circle-2"></i> Proceed to Resolution & Proof →
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        window.location.href = 'officer.html';
        return;
      }

      try {
        const data = await API.getComplaintById(id);
        
        document.getElementById('oc-loading').style.display = 'none';
        document.getElementById('oc-content').style.display = 'block';

        document.getElementById('oc-id').textContent = `#${data.id.substring(0, 8)}`;
        document.getElementById('oc-title').textContent = data.title || data.description.substring(0, 70);
        document.getElementById('oc-date').textContent = Utils.formatDate(data.created_at);
        document.getElementById('oc-citizen-name').textContent = data.citizen_name || 'Citizen';
        document.getElementById('oc-citizen-phone').textContent = data.citizen_phone || 'N/A';
        document.getElementById('oc-description').textContent = data.description;
        document.getElementById('oc-location-text').textContent = data.address || data.zone || 'Nagpur';
        document.getElementById('oc-current-status-text').textContent = data.status;

        const badgeContainer = document.getElementById('oc-status-badges');
        badgeContainer.innerHTML = `
          ${Utils.getCategoryBadge(data.category)}
          ${Utils.getPriorityBadge(data.priority)}
          ${Utils.getStatusBadge(data.status)}
        `;

        document.getElementById('oc-sla-badge').innerHTML = Utils.getSlaBadge(data.sla_deadline, data.status);

        // Photo
        if (data.photo_url) {
          const img = document.getElementById('oc-photo');
          img.src = data.photo_url;
          img.style.display = 'block';
          document.getElementById('oc-no-photo').style.display = 'none';
        }

        // Map
        const map = new MapEngine('oc-map', {
          center: [data.latitude || 21.1458, data.longitude || 79.0882],
          zoom: 14
        });
        if (data.latitude && data.longitude) {
          map.setPickerLocation(data.latitude, data.longitude);
        }

        // Resolve link
        document.getElementById('btn-oc-resolve-link').href = `resolution.html?id=${encodeURIComponent(data.id)}&role=officer`;

        // Start Work action
        const startBtn = document.getElementById('btn-oc-start-work');
        if (data.status === 'IN_PROGRESS' || data.status === 'RESOLVED' || data.status === 'CLOSED') {
          startBtn.disabled = true;
          startBtn.textContent = data.status === 'IN_PROGRESS' ? 'Work Currently In Progress' : 'Work Completed';
        } else {
          startBtn.addEventListener('click', async () => {
            try {
              startBtn.disabled = true;
              startBtn.innerHTML = '<span class="spinner" style="width: 14px; height: 14px; border-width: 2px;"></span> Updating...';
              await API.updateComplaintStatus(data.id, 'IN_PROGRESS', 'Field officer started work at site.');
              Utils.showToast('Grievance marked IN PROGRESS!', 'success');
              setTimeout(() => window.location.reload(), 1000);
            } catch (e) {
              Utils.showToast('Failed to update status: ' + e.message, 'danger');
              startBtn.disabled = false;
              startBtn.innerHTML = '<i data-lucide="play"></i> Mark In Progress';
            }
          });
        }

        if (window.lucide) lucide.createIcons();
      } catch (err) {
        console.error('Failed to load complaint workspace:', err);
        document.getElementById('oc-loading').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" style="color: var(--danger);"><i data-lucide="alert-triangle"></i></div>
            <div class="empty-state-title">Unable to Open Grievance Workspace</div>
            <div class="empty-state-text">${Utils.escapeHtml(err.message)}</div>
            <a href="officer.html" class="btn btn-secondary" style="margin-top: 16px;">Back to Queue</a>
          </div>
        `;
        if (window.lucide) lucide.createIcons();
      }
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
